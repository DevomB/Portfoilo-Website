       mirrored upside down like a real playing card), joker-green diamond pips -->
  <g transform="rotate(-7 32 32)">
    <rect x="15" y="5" width="34" height="54" rx="7" fill="#0d0a14" stroke="#7c00ff" stroke-width="3"/>
    <path d="M22 11 h4 a6 6 0 0 1 0 12 h-4 Z" stroke="#f2eefa" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <rect x="24" y="26" width="5" height="5" transform="rotate(45 26.5 28.5)" fill="#09ff00"/>
    <g transform="rotate(180 32 32)">
      <path d="M22 11 h4 a3.2 3.2 0 0 1 0 6.4 h-4 Z M22 17.4 h4.6 a3.3 3.3 0 0 1 0 6.6 h-4.6 Z" stroke="#f2eefa" stroke-width="3" fill="none" stroke-linejoin="round"/>
      <rect x="24" y="26" width="5" height="5" transform="rotate(45 26.5 28.5)" fill="#09ff00"/>
    </g>
  </g>
</svg>
