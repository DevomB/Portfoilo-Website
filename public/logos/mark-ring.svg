<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The ring: the splash itself — cards ringing the centre, one pulled out
       and revealed in green -->
  <g fill="#a35cff">
    <g transform="rotate(36 32 32)"><rect x="29.8" y="9" width="4.4" height="11" rx="2.2"/></g>
    <g transform="rotate(72 32 32)"><rect x="29.8" y="9" width="4.4" height="11" rx="2.2"/></g>
    <g transform="rotate(108 32 32)"><rect x="29.8" y="9" width="4.4" height="11" rx="2.2"/></g>
    <g transform="rotate(144 32 32)"><rect x="29.8" y="9" width="4.4" height="11" rx="2.2"/></g>
    <g transform="rotate(180 32 32)"><rect x="29.8" y="9" width="4.4" height="11" rx="2.2"/></g>
    <g transform="rotate(216 32 32)"><rect x="29.8" y="9" width="4.4" height="11" rx="2.2"/></g>
    <g transform="rotate(252 32 32)"><rect x="29.8" y="9" width="4.4" height="11" rx="2.2"/></g>
    <g transform="rotate(288 32 32)"><rect x="29.8" y="9" width="4.4" height="11" rx="2.2"/></g>
    <g transform="rotate(324 32 32)"><rect x="29.8" y="9" width="4.4" height="11" rx="2.2"/></g>
  </g>
  <!-- the revealed card: pulled outward, joker green -->
  <rect x="29.8" y="3.5" width="4.4" height="12.5" rx="2.2" fill="#09ff00"/>
  <rect x="26.8" y="26.8" width="10.4" height="10.4" transform="rotate(45 32 32)"
        fill="none" stroke="#7c00ff" stroke-width="2.6"/>
</svg>
