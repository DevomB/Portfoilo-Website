[package]
name = "pallas-arena"
version = "0.1.0"
edition = "2021"
publish = false
description = "Thin WASI wrapper around the published athenas-pallas engine for the Adversarial Tape demo"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The real engine, from crates.io — nothing here re-implements it. The wrapper
# only builds a BacktestConfig, plugs textbook strategies into the engine's
# own `Strategy` trait, and serialises its BacktestReport.
athenas-pallas = "5.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1"
smol_str = "0.3"
time = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
